<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>紅葉ヒルクライム</title>
<style>
/* Layout: full-bleed 16:9 cockpit view on top, thumb controls underneath on touch screens.
   Single dark look by choice: the game is a night-edge dusk drive, so every color is explicit. */
:root{
  --bg:#0d0a08;
  --fg:#f2e6d4;
  --muted:#a08c76;
  --accent:#d8432a;
  --amber:#f0a23a;
  --panel:#1a1411;
  --line:#3a2d24;
  color-scheme:dark;
  --font-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:"Share Tech Mono","SF Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-jp);
  padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{position:relative;width:min(100%,calc((100vh - 140px)*16/9),1280px);min-width:0}
canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;outline:1px solid var(--line)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,rgba(13,10,8,.55),rgba(13,10,8,.82));border-radius:6px;text-align:center;padding:16px}
#overlay[hidden]{display:none!important}
#overlay h1{margin:0;font-size:clamp(22px,4.6vw,46px);font-weight:700;letter-spacing:.12em;text-wrap:balance}
#overlay p{margin:0;color:var(--muted);font-size:clamp(11px,1.6vw,15px);line-height:1.7;max-width:46ch;text-wrap:balance}
#overlay .res{font-family:var(--font-num);color:var(--amber);font-size:clamp(14px,2.4vw,24px)}
button{font:inherit;color:var(--fg);background:var(--accent);border:0;border-radius:4px;padding:10px 26px;font-weight:700;letter-spacing:.2em;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#pad{display:none;width:100%;max-width:720px;justify-content:space-between;gap:10px}
#pad .grp{display:flex;gap:10px}
#pad .k{width:clamp(44px,13vw,92px);height:clamp(44px,12vw,68px);display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:22px;color:var(--fg);touch-action:none}
#pad .k.on{background:var(--accent)}
#hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Share+Tech+Mono&display=swap">

<div id="wrap">
  <canvas id="c" width="960" height="540" aria-label="ドライバー視点の走行画面"></canvas>
  <div id="overlay">
    <h1>紅葉ヒルクライム</h1>
    <p>嵐山・清滝口から小倉山、保津峡、菖蒲谷池を抜けて高雄大駐車場へ。嵐山-高雄パークウェイを思わせる秋の山道を、オープン2シーターの運転席から。夜明け前の暗さから霧と雨を抜け、たどり着くのは晴れた早朝。落石やパイロンをかわして走り切ろう。チェックポイントで時間が延びます。</p>
    <div class="res" id="res"></div>
    <button id="go">スタート</button>
  </div>
</div>
<div id="pad">
  <div class="grp"><div class="k" id="kL">◀</div><div class="k" id="kR">▶</div><div class="k" id="kH" role="button" aria-label="ヘッドライト">灯</div><div class="k" id="kW" role="button" aria-label="ワイパー">ワ</div></div>
  <div class="grp"><div class="k" id="kB">B</div><div class="k" id="kA">A</div></div>
</div>
<div id="hint">← → / A D ハンドル　↑ / W アクセル　↓ / S ブレーキ　Space ハンドブレーキ　H リトラクタブルヘッドライト　V ワイパー</div>
<script>
// ===== Engine: track, sprites, background, road renderer =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,HZ=Math.round(H*0.43);
const SEG=200,RW=2000,DRAW=200,CAMH=520,FOV=100,CAMD=1/Math.tan(FOV/2*Math.PI/180);
const MAXV=SEG*66; // world units / sec  (~198 km/h)
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const segs=[];
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
function addSeg(curve,y){
  const n=segs.length;
  segs.push({index:n,curve,sprites:[],env:{},dark:Math.floor(n/4)%2,
    p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},
    p2:{world:{y:y,z:(n+1)*SEG},camera:{},screen:{}}});
}
function addRoad(e,h,l,c,hill){
  const sy=lastY(),ey=sy+hill*SEG,t=e+h+l;
  for(let i=0;i<e;i++)addSeg(easeIn(0,c,i/e),easeInOut(sy,ey,i/t));
  for(let i=0;i<h;i++)addSeg(c,easeInOut(sy,ey,(e+i)/t));
  for(let i=0;i<l;i++)addSeg(easeInOut(c,0,i/l),easeInOut(sy,ey,(e+h+i)/t));
}
// Course: a lap of the Arashiyama-Takao Parkway (嵐山-高雄パークウェイ) in miniature.
// 嵐山・清滝口ゲート → 花街道 → 小倉山のアップダウン/連続S字 → 保津峡展望台と保津川橋
// → 愛宕前へのつづら折り → 愛宕橋 → 菖蒲谷池と池の橋/菖蒲ヶ丘展望台 → 紅葉のトンネル → 高雄大駐車場。
// pieces: [enter, hold, leave, curve, hill]  curve bends the road, hill gains metres per segment
const piece=(e,h,l,c,hill)=>{const s0=segs.length;addRoad(e,h,l,c,hill);return [s0,segs.length]};
const mark=(r,f)=>{for(let i=r[0];i<r[1];i++)f(segs[i])};
addRoad(50,50,50,0,0);                             // 嵐山・清滝口ゲート前の直線
const gate=piece(25,20,25,0,10);                   // ゲートをくぐって嵯峨鳥居本へ
piece(20,15,20,3,25);                              // 花街道のゆるい上り
piece(18,16,18,5,25);                              // 小倉山の連続S字
piece(18,16,18,-5,20);
piece(18,22,22,8,10);                              // 小倉山のヘアピン（左）
piece(16,14,16,0,25);
piece(18,20,22,-8,15);                             // ヘアピン（右）
piece(16,12,16,-5,-25);                            // 小倉山のアップダウン
piece(16,12,16,5,-25);
const ogura=piece(18,20,18,2,40);                  // 小倉山展望台のクリスト
piece(18,20,18,0,-45);                             // 保津峡へ落ちる
piece(22,30,22,-4,-20);
const tunA=piece(24,150,24,0,-18);                  // 保津峡トンネル
const hozuApp=piece(28,55,28,3,-5);                // 保津峡展望台へ
const lakeA0=piece(30,90,30,2,0);                  // 保津川沿い（左手に川）
const bayA=piece(25,70,25,-1.5,0);                 // 保津川橋
const lakeA1=piece(30,90,30,-2,0);                 // 川沿いを抜ける
piece(20,25,20,4,30);                              // 愛宕前への登り
piece(16,16,16,6,30);                              // つづら折り
piece(16,16,16,-6,30);
piece(20,40,20,-9,25);                             // ヘアピン
piece(18,30,18,0,45);                              // 稜線
const atago=piece(18,20,18,2,-15);                 // 愛宕前展望台
const valleyB=piece(30,120,30,0,0);                // 愛宕橋
piece(16,14,16,-5,30);
piece(16,14,16,5,30);
piece(22,40,22,4,-40);                             // 下りスイーパー
piece(22,40,22,-4,-40);
piece(14,14,14,7,0);                               // 菖蒲谷池へのタイトな下り
piece(14,14,14,-7,0);
piece(14,14,14,7,0);
piece(22,30,22,-3,35);
piece(18,16,18,5,-20);
piece(18,35,20,8,-15);                             // 池を見下ろすヘアピン
piece(16,16,16,-6,-25);
piece(16,16,16,6,-25);
piece(22,45,22,-3,-10);
const pondApp=piece(28,60,28,2,-5);                // 菖蒲谷池へ
const lakeB0=piece(30,90,30,-2,0);                 // 池の湖畔（右手に水）
const bayB=piece(25,70,25,1.5,0);                  // 池の橋
const lakeB1=piece(30,80,30,2,0);
const shobu=piece(18,20,18,-4,25);                 // 菖蒲ヶ丘展望台
const tunnel=piece(30,70,30,3,-20);                // 紅葉のトンネル
piece(25,50,25,-4,-20);
piece(20,30,20,3,15);
piece(16,16,16,-6,5);
piece(16,16,16,6,5);
const tunB=piece(24,150,24,0,14);                  // 高雄トンネル
const goal=piece(40,90,40,0,-10);                  // 高雄大駐車場への直線
piece(40,40,40,0,0);
const N=segs.length,TOTAL=N*SEG;
const CPS=[Math.floor(N*0.25),Math.floor(N*0.5),Math.floor(N*0.75)];
const FIN=TOTAL-SEG*120;   // the finish line sits inside the meeting area, with the rows of cars ahead
const FINSEG=Math.floor(FIN/SEG);
// water and bridge sections
mark([lakeA0[0],lakeA1[1]],s=>s.env.water=-1);
mark(bayA,s=>{s.env.water=2;s.env.bridge=true});
mark(valleyB,s=>{s.env.water=2;s.env.bridge=true});
mark([lakeB0[0],lakeB1[1]],s=>s.env.water=1);
mark(bayB,s=>{s.env.water=2;s.env.bridge=true});
// two tunnels bored through the ridge, and stretches of deep forest
mark([tunA[0]+14,tunA[1]-14],s=>{s.env.tunnel=1;s.env.tname='保津峡トンネル'});
mark([tunB[0]+14,tunB[1]-14],s=>{s.env.tunnel=1;s.env.tname='高雄トンネル'});
const FOREST=[[hozuApp[1]+12,hozuApp[1]+96],[shobu[1]+8,shobu[1]+78]];
for(const r of FOREST)mark(r,s=>s.env.forest=1);

// ===== the sights along the pass: viewpoints, the little park, the fishing pond =====
// cleared of roadside trees so the structures stay visible from the road
const VIEWS=[[ogura[0]+6,ogura[0]+36],[hozuApp[0]+8,hozuApp[0]+42],[atago[0]+2,atago[0]+30],[shobu[0]+2,shobu[0]+30]];
const YUEN=[tunnel[1]+12,goal[0]-16];
const clearRange=(a,b)=>{for(let i=Math.max(0,a);i<Math.min(N,b);i++)segs[i].env.clear=1};
for(const r of VIEWS)clearRange(r[0],r[1]);
clearRange(YUEN[0]+22,YUEN[0]+48);
clearRange(YUEN[0]+64,YUEN[0]+92);

// ===== 高雄大駐車場: the last climb opens out into the meeting car park =====
// body colours of the NAs that turn up at a ユーノス meeting
const NA_COL=['#c8102e','#c8102e','#b4142a','#2f6fb5','#1d5c3a','#e8c33a','#c9c9cf','#f2f2ee',
  '#14161a','#2a8fa8','#8a2f6b','#d8d4c8','#b8321f','#e0a03a','#3b4a8c','#6f8f4a'];
const PARK0=goal[0]+14,venueEnd=N-4;
const LOTW=2.15;                  // tarmac reaches this far out, in road half-widths
const STALL=7;                    // one parking bay every seven segments
for(let i=PARK0-18;i<venueEnd;i++){
  const s=segs[i],t=Math.max(0,Math.min(1,(i-(PARK0-18))/18));
  s.env.park=1;
  s.env.lot=1+(LOTW-1)*(t*t*(3-2*t));      // the road opens out into the lot
}
// roadside trees (autumn palette)
const LEAF=['#c0321c','#d9481c','#ee7a1f','#f2a62c','#e8c43c','#a3261a','#8c3a14'];
for(let i=8;i<N-10;i+=2){
  const w=segs[i].env.water,lot=segs[i].env.lot;
  if(segs[i].env.tunnel)continue;                // nothing grows inside the bore
  if(segs[i].env.forest){
    // a thick wood crowding the road, the crowns closing overhead
    for(const side of[-1,1]){
      if(rnd()<0.97)segs[i].sprites.push({x:side*(1.06+rnd()*0.5),h:2500+rnd()*2000,
        col:Math.floor(rnd()*LEAF.length),pine:rnd()<0.28,r:rnd()});
      if(rnd()<0.7)segs[i].sprites.push({x:side*(1.9+rnd()*3.4),h:2200+rnd()*2000,
        col:Math.floor(rnd()*LEAF.length),pine:rnd()<0.3,r:rnd()});
    }
    continue;
  }
  for(const side of[-1,1]){
    if(w===2||w===side)continue;                 // nothing growing out in the lake
    if(segs[i].env.clear)continue;               // a viewpoint or the park stands here
    if(lot){                                     // the car park is ringed with trees, the bays kept clear
      if(rnd()<0.9)segs[i].sprites.push({x:side*(lot+0.45+rnd()*2.3),h:1500+rnd()*1500,
        col:Math.floor(rnd()*LEAF.length),pine:rnd()<0.12,r:rnd()});
      continue;
    }
    if(rnd()<0.82){
      segs[i].sprites.push({x:side*(1.45+rnd()*3.2),h:1500+rnd()*1700,
        col:Math.floor(rnd()*LEAF.length),pine:rnd()<0.14,r:rnd()});
    }
    // a deeper band of forest so the hillside behind never reads as bare ground
    if(i%4===0&&rnd()<0.62){
      segs[i].sprites.push({x:side*(5.2+rnd()*8),h:1600+rnd()*2100,
        col:Math.floor(rnd()*LEAF.length),pine:rnd()<0.3,r:rnd()});
    }
  }
}
// ===== Obstacles on the pass: rocks, cones, barrier boards, leaf drifts, puddles =====
const obstacles=[];
const OBS_R={rock:.17,cone:.14,barrier:.20,leaves:.30,puddle:.26};
function addObstacle(i,kind,x){
  const o={kind,x,z:i*SEG+SEG*.5,r:OBS_R[kind]};
  segs[i].sprites.push(o);obstacles.push(o);return o;
}
let lastOb=-99;
for(let i=100;i<PARK0-40;i++){
  if(i-lastOb<52)continue;
  const bend=Math.abs(segs[i].curve)+Math.abs(segs[i-2].curve)+Math.abs(segs[i+2].curve);
  if(bend>9)continue;                             // keep the sharpest corners clean
  if(rnd()>0.32)continue;
  const q=rnd();let kind;
  if(q<0.26)kind='rock';else if(q<0.5)kind='cone';else if(q<0.66)kind='barrier';
  else if(q<0.84)kind='leaves';else kind='puddle';
  let x=(rnd()*2-1)*0.6;
  if(kind==='rock')x=(rnd()<0.5?-1:1)*(0.42+rnd()*0.36);      // rocks lie near the edge
  if(kind==='barrier')x=(rnd()<0.5?-1:1)*(0.18+rnd()*0.45);
  addObstacle(i,kind,x);lastOb=i;
}
// set pieces: a coned-off shoulder and damp patches along the lakeside
function coneRow(i0,n,step,x0,dx){for(let k=0;k<n;k++)addObstacle(i0+k*step,'cone',x0+dx*k)}
coneRow(bayA[0]-30,5,5,-0.84,0.03);
coneRow(valleyB[0]-30,6,5,0.8,-0.03);
addObstacle(valleyB[0]-6,'barrier',0.5);
addObstacle(lakeA0[0]+26,'leaves',0.42);
addObstacle(lakeB0[0]+14,'puddle',-0.34);
addObstacle(lakeB0[0]+52,'puddle',0.3);
addObstacle(bayB[0]+40,'leaves',-0.5);
// 保津川下りの舟と、菖蒲谷池のボート
for(const r of [[lakeA0,-1],[lakeA1,-1],[lakeB0,1],[lakeB1,1]]){
  for(let k=1;k<=3;k++){
    const i=Math.floor(r[0][0]+(r[0][1]-r[0][0])*k/4);
    segs[i].sprites.push({kind:'boat',x:r[1]*(2.7+k*1.1)});
  }
}
// parkway signposts along the lap
function signAt(i,x,text){segs[Math.max(2,Math.min(N-3,i))].sprites.push({kind:'sign',x,text})}
signAt(gate[0]+12,1.62,'嵐山 清滝口');
signAt(ogura[0]+6,-1.62,'小倉山展望台');
signAt(hozuApp[0]+8,1.62,'保津峡展望台');
signAt(bayA[0]+10,1.9,'保津川橋');
signAt(atago[0]+6,-1.62,'愛宕前展望台');
signAt(valleyB[0]+10,1.9,'愛宕橋');
signAt(pondApp[0]+34,1.62,'菖蒲谷池');
signAt(shobu[0]+8,-1.62,'菖蒲ヶ丘展望台');
signAt(tunnel[0]+8,1.62,'紅葉のトンネル');
signAt(goal[0]+8,1.62,'高雄大駐車場');
segs[tunA[0]+14].sprites.push({kind:'portal',x:0,h:2700,text:'保津峡トンネル'});
segs[tunB[0]+14].sprites.push({kind:'portal',x:0,h:2600,text:'高雄トンネル'});
// 展望台: a timber deck and a roofed shelter at each viewpoint
const deckAt=(i,side,x)=>segs[i].sprites.push({kind:'deck',x:side*x,h:1250,ph:rnd()});
const shelterAt=(i,side,x)=>segs[i].sprites.push({kind:'deck',x:side*x,h:2350,roof:true,ph:rnd()});
deckAt(VIEWS[0][0]+8,-1,1.62);shelterAt(VIEWS[0][0]+18,-1,2.6);
deckAt(VIEWS[1][0]+10,1,1.62);shelterAt(VIEWS[1][0]+22,1,2.65);
deckAt(VIEWS[2][0]+6,-1,1.62);shelterAt(VIEWS[2][0]+16,-1,2.6);
deckAt(VIEWS[3][0]+6,-1,1.62);shelterAt(VIEWS[3][0]+16,-1,2.65);
// 観空台遊園地: the wheel turning over the trees, striped tents, bunting
segs[YUEN[0]+52].sprites.push({kind:'ferris',x:10.5,h:18500,ph:0});
segs[YUEN[0]+90].sprites.push({kind:'ferris',x:13.5,h:13500,ph:1.7});
segs[YUEN[0]+28].sprites.push({kind:'tent',x:3.35,h:2600,col:0});
segs[YUEN[0]+38].sprites.push({kind:'tent',x:4.6,h:2300,col:1});
segs[YUEN[0]+70].sprites.push({kind:'tent',x:3.5,h:2450,col:2});
segs[YUEN[0]+80].sprites.push({kind:'tent',x:4.7,h:2150,col:3});
segs[YUEN[0]+4].sprites.push({kind:'arch',x:0,text:'観空台遊園地'});
for(let i=YUEN[0]+4;i<YUEN[1];i+=8)segs[i].sprites.push({kind:'flag',x:(Math.floor(i/8)%2?1:-1)*1.34});
// 菖蒲谷池の釣り堀: huts on stilts out over the water, a floating jetty, a sign
segs[lakeB0[0]+30].sprites.push({kind:'pier',x:1.58,h:560});
segs[lakeB0[0]+44].sprites.push({kind:'hut',x:2.85,h:2000});
segs[lakeB0[0]+98].sprites.push({kind:'pier',x:1.62,h:520});
segs[lakeB0[0]+112].sprites.push({kind:'hut',x:3.15,h:1900});
segs[lakeB1[0]+40].sprites.push({kind:'pier',x:1.58,h:540});
segs[lakeB1[0]+56].sprites.push({kind:'hut',x:3.0,h:2050});
signAt(lakeB0[0]+34,1.66,'つり堀');
// ===== Finish: the Roadster meeting filling the 高雄大駐車場 =====
const pickCol=()=>NA_COL[Math.floor(rnd()*NA_COL.length)];
function parkCar(i,x,view,top,pod){
  segs[Math.max(0,Math.min(venueEnd-2,i))].sprites.push({kind:'car',x,col:pickCol(),view,top,pod});
}
// bays down both sides of the central aisle, two ranks deep and nearly full
for(let i=PARK0+2;i<venueEnd-10;i+=STALL){
  for(const side of[-1,1]){
    if(rnd()<0.95)parkCar(i,side*(0.96+rnd()*0.08),rnd()<0.5?'front':'rear',rnd()<0.34,rnd()<0.55);
    if(rnd()<0.9)parkCar(i+4,side*(1.76+rnd()*0.10),rnd()<0.5?'front':'rear',rnd()<0.4,rnd()<0.5);
  }

function waterBand(s,a,b,side,st){

  quad(e1,a.y,e1+side*a.w*.34,a.y-0.4,e2+side*b.w*.34,b.y-0.4,e2,b.y,'rgba(140,64,26,.34)');

  if(top)carTop(w,h,sx,sy,false);
  // nose, wide fenders and the low hood
  const g=ctx.createLinearGradient(0,sy-h*.56,0,sy);
  g.addColorStop(0,shade(c,1.34));g.addColorStop(.32,c);g.addColorStop(1,shade(c,.52));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(sx-w*.50,sy-h*.09);
  ctx.quadraticCurveTo(sx-w*.505,sy-h*.34,sx-w*.45,sy-h*.46);
  ctx.quadraticCurveTo(sx-w*.425,sy-h*.525,sx-w*.40,sy-h*.535);
  ctx.lineTo(sx+w*.40,sy-h*.535);
  ctx.quadraticCurveTo(sx+w*.425,sy-h*.525,sx+w*.45,sy-h*.46);
  ctx.quadraticCurveTo(sx+w*.505,sy-h*.34,sx+w*.50,sy-h*.09);
  ctx.closePath();ctx.fill();
  // the crease along each fender
  ctx.strokeStyle='rgba(255,240,214,.26)';ctx.lineWidth=Math.max(.7,h*.014);
  for(const s of[-1,1]){
    ctx.beginPath();ctx.moveTo(sx+s*w*.46,sy-h*.15);
    ctx.quadraticCurveTo(sx+s*w*.45,sy-h*.42,sx+s*w*.36,sy-h*.52);ctx.stroke();
  }
  // the cowl line the screen sits on
  ctx.strokeStyle='rgba(50,8,4,.30)';ctx.lineWidth=Math.max(.6,h*.010);
  ctx.beginPath();ctx.moveTo(sx-w*.21,sy-h*.533);ctx.lineTo(sx+w*.21,sy-h*.533);ctx.stroke();
  carScreen(w,h,sx,sy);
  // pop-up lamps: standing up out of the hood, or lying flush in it
  for(const s of[-1,1]){
    const px=sx+s*w*.345,base=sy-h*.538;
    if(pods&&amt>0.03){
      const rise=h*.095*amt;
      if(lamp){
        const g=ctx.createRadialGradient(px,base-rise,0,px,base-rise,Math.max(3,w*.55));
        g.addColorStop(0,'rgba(255,244,200,.75)');
        g.addColorStop(.45,'rgba(255,228,160,.28)');
        g.addColorStop(1,'rgba(255,220,140,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,base-rise,Math.max(3,w*.55),0,TAU);ctx.fill();
      }
      ctx.fillStyle='rgba(18,9,5,.30)';ctx.beginPath();ctx.ellipse(px,base,w*.108,h*.014,0,0,TAU);ctx.fill();
      ctx.fillStyle=shade(c,1.0);
      ctx.beginPath();ctx.roundRect(px-w*.10,base-rise,w*.20,rise+Math.max(.8,h*.008),Math.max(1,h*.012));ctx.fill();
      ctx.strokeStyle='rgba(28,14,8,.55)';ctx.lineWidth=Math.max(.5,h*.006);ctx.stroke();
      if(amt>0.55){
        ctx.fillStyle='rgba(16,11,8,.92)';ctx.fillRect(px-w*.082,base-rise+rise*.22,w*.164,Math.max(.6,h*.020*amt));
        ctx.fillStyle=lamp?'#fff8d8':'#5b5348';
        ctx.beginPath();ctx.ellipse(px,base-rise+rise*.34,w*.055,Math.max(.5,h*.013*amt),0,0,TAU);ctx.fill();
      }
    }else{
      ctx.strokeStyle=shade(c,1.6);ctx.lineWidth=Math.max(.6,h*.010);
      ctx.beginPath();ctx.ellipse(px,base+h*.008,w*.085,h*.018,0,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(255,244,210,.22)';ctx.beginPath();ctx.ellipse(px,base+h*.008,w*.05,h*.008,0,0,TAU);ctx.fill();
    }
  }
  // bumper, the small oval mouth, indicators and the plate
  ctx.fillStyle=shade(c,.40);ctx.fillRect(sx-w*.50,sy-h*.09,w,h*.09);
  ctx.fillStyle='#100d0c';ctx.beginPath();ctx.ellipse(sx,sy-h*.245,w*.145,h*.048,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,236,196,.22)';ctx.beginPath();ctx.ellipse(sx,sy-h*.267,w*.115,h*.012,0,0,TAU);ctx.fill();
  for(const s of[-1,1]){
    ctx.fillStyle='#e8962e';
    ctx.beginPath();ctx.roundRect(sx+s*w*.41-w*.042,sy-h*.215,w*.084,h*.030,Math.max(1,h*.008));ctx.fill();
  }
  ctx.fillStyle='#e9e6d8';ctx.fillRect(sx-w*.068,sy-h*.168,w*.136,h*.044);
  ctx.fillStyle='rgba(30,40,60,.55)';ctx.fillRect(sx-w*.044,sy-h*.156,w*.088,h*.016);
}

  ctx.fillStyle='#8f9394';ctx.fillRect(sx+w*.33,sy-h*.058,w*.072,h*.040);

function drawDeck(o,sc,sx,sy,clip){
  const h=(o.h||1250)*sc*H/2;if(h<2.5)return;
  const w=h*(o.roof?2.5:2.3);
  if(sy-h>clip)return;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,clip);ctx.clip();

  ctx.fillStyle='#4a3626';

  ctx.fillRect(sx+w*.40-post,sy-h*.44,post,h*.44);

  // a bench set back on the deck

  if(o.roof){

function bridgeRail(seg,side,clip){

function drawTunnelRing(cx,cy,w,far,tint){
  const aw=w*1.32,ah=w*1.58;
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,Math.max(0,Math.min(H,cy)));ctx.clip();
  ctx.beginPath();
  ctx.rect(-6,-6,W+12,H+12);
  ctx.moveTo(cx-aw,cy+60);
  ctx.lineTo(cx-aw,cy-ah*.52);
  ctx.quadraticCurveTo(cx-aw,cy-ah,cx-aw*.60,cy-ah);
  ctx.lineTo(cx+aw*.60,cy-ah);
  ctx.quadraticCurveTo(cx+aw,cy-ah,cx+aw,cy-ah*.52);
  ctx.lineTo(cx+aw,cy+60);
  ctx.closePath();
  ctx.fillStyle='rgb('+Math.round(26+tint*16)+','+Math.round(21+tint*12)+','+Math.round(17+tint*9)+')';
  ctx.fill('evenodd');
  // the concrete lining at the mouth of the bore
  ctx.strokeStyle='rgba(138,120,98,'+(0.20+tint*0.16).toFixed(2)+')';
  ctx.lineWidth=Math.max(1,w*0.022);
  ctx.stroke();
  if(far){
    // daylight at the far end
    const g=ctx.createRadialGradient(cx,cy-ah*.42,0,cx,cy-ah*.40,Math.max(2,w*1.05));
    g.addColorStop(0,'rgba(255,251,240,.98)');
    g.addColorStop(.45,'rgba(255,243,220,.92)');
    g.addColorStop(.8,'rgba(238,240,240,.55)');
    g.addColorStop(1,'rgba(226,236,244,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(cx-aw,cy+4);
    ctx.lineTo(cx-aw,cy-ah*.52);
    ctx.quadraticCurveTo(cx-aw,cy-ah,cx-aw*.60,cy-ah);
    ctx.lineTo(cx+aw*.60,cy-ah);
    ctx.quadraticCurveTo(cx+aw,cy-ah,cx+aw,cy-ah*.52);
    ctx.lineTo(cx+aw,cy+4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function drawTunnel(base){
  let start=-1;
  for(let n=0;n<DRAW;n++){
    if(segs[(base.index+n)%N].env.tunnel){start=n;break}
  }
  if(start<0||start>60)return;                 // only once the mouth is in sight
  const list=[];
  for(let n=start;n<DRAW;n++){
    const s=segs[(base.index+n)%N];
    if(!s.env.tunnel)break;
    list.push(s);
  }
  if(!list.length)return;
  for(let i=list.length-1;i>=0;i-=3){
    const scr=list[i].p1.screen;
    if(!(scr.scale>0)||scr.y<0)continue;
    const t=1-i/Math.max(1,list.length-1);
    drawTunnelRing(scr.x,scr.y,scr.w,i>list.length-5,t);
  }
  // name board over the mouth
  {
    const s0=list[0],scr=s0.p1.screen;
    if(s0.env.tname&&scr.scale>0&&scr.w>70&&scr.y>40){
      const aw=scr.w*1.32,ah=scr.w*1.58;
      const fs=Math.min(scr.w*0.30,scr.w*1.1/Math.max(2,s0.env.tname.length));
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(18,14,10,.55)';
      ctx.fillRect(scr.x-fs*s0.env.tname.length*0.62,scr.y-ah-fs*1.25,fs*s0.env.tname.length*1.24,fs*1.5);
      ctx.fillStyle='#e6dfc9';
      ctx.font='700 '+fs.toFixed(1)+'px "Zen Kaku Gothic New",sans-serif';
      ctx.fillText(s0.env.tname,scr.x,scr.y-ah-fs*0.5);
    }
  }
  // sodium lamps along the crown, receding into the dark
  for(let i=list.length-1;i>=0;i-=9){
    const s=list[i],scr=s.p1.screen;
    if(!(scr.scale>0)||scr.y<0)continue;
    const aw=scr.w*1.32,ah=scr.w*1.58;
    for(const side of[-1,1]){
      const lx=scr.x+side*aw*.66,ly=scr.y-ah*.84;
      const rr=Math.max(2.5,scr.w*.22);
      const g=ctx.createRadialGradient(lx,ly,0,lx,ly,rr);
      g.addColorStop(0,'rgba(255,214,150,.95)');
      g.addColorStop(.35,'rgba(255,168,72,.42)');
      g.addColorStop(1,'rgba(255,150,40,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,ly,rr,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,226,176,.9)';ctx.beginPath();ctx.arc(lx,ly,Math.max(.8,scr.w*.035),0,TAU);ctx.fill();
    }
  }
}

function drawPortal(o,sc,sx,sy,clip){

function drawLeaves(st,dt){
  const v=st.speed/444; // metres per second
  const nShow=Math.round(leaves.length*Math.min(1,Math.max(.18,TV.leaves)));
  for(let li=0;li<nShow;li++){

    l.z-=v*dt;l.y-=0.35*dt;l.x+=Math.sin(l.ph+st.t*1.3)*dt*.4;l.rot+=l.vr*dt;
    if(l.z<.8||l.y<-1.4){l.z=30+rnd()*14;l.y=rnd()*4-.4;l.x=(rnd()-.5)*10;}
    const f=403/l.z,sx=W/2+l.x*f,sy=HZ-l.y*f;

  if(e.code==='KeyH'){if(!e.repeat)st.lightOn=!st.lightOn;e.preventDefault();return}
  if(e.code==='KeyV'){if(!e.repeat)st.wiper=st.wiper?0:1;e.preventDefault();return}
  const k=KM[e.code];if(k){keys[k]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=false;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
for(const [id,k] of[['kL','left'],['kR','right'],['kA','up'],['kB','down']]){
  const el=document.getElementById(id);
  const on=e=>{keys[k]=true;el.classList.add('on');e.preventDefault()};
  const off=e=>{keys[k]=false;el.classList.remove('on');e.preventDefault()};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
document.getElementById('kH').addEventListener('pointerdown',e=>{st.lightOn=!st.lightOn;e.preventDefault()});
document.getElementById('kW').addEventListener('pointerdown',e=>{st.wiper=st.wiper?0:1;e.currentTarget.classList.toggle('on',!!st.wiper);e.preventDefault()});
// ----- sound: engine (4-cylinder note), wind, rail scrape -----
let ac=null,au=null;
function startAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
      const o1=ac.createOscillator(),o2=ac.createOscillator(),lp=ac.createBiquadFilter(),eg=ac.createGain(),g2=ac.createGain();
      o1.type='sawtooth';o2.type='square';lp.type='lowpass';g2.gain.value=.35;
      o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(eg);eg.connect(master);eg.gain.value=0;
      const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const mk=(f,q)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;const g=ac.createGain();g.gain.value=0;s.connect(b);b.connect(g);g.connect(master);s.start();return g};
      const wind=mk(700,.6),scr=mk(2200,1.2),rain=mk(5200,.7);
      o1.start();o2.start();
      au={o1,o2,lp,eg,wind,scr,rain};
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null;au=null}
}
function updateAudio(){
  if(!au)return;
  const on=st.state==='run'?1:0,sp=st.speed/MAXV,f=st.rpm/60*2,tn=ac.currentTime;
  au.o1.frequency.setTargetAtTime(f,tn,.03);au.o2.frequency.setTargetAtTime(f/2,tn,.03);
  au.lp.frequency.setTargetAtTime(380+(keys.up?1500:300)+st.rpm*.18,tn,.05);
  au.eg.gain.setTargetAtTime(on*(.05+(keys.up?.07:.02)),tn,.05);
  au.wind.gain.setTargetAtTime(sp*sp*.16,tn,.1);
  au.scr.gain.setTargetAtTime(st.scrape>0?.22:0,tn,.04);
  au.rain.gain.setTargetAtTime(TV.rain*.07,tn,.25);
}
// ----- driving model -----
function reset(){
  Object.assign(st,{pos:0,x:0,speed:0,steer:0,kmh:0,rpm:900,gear:0,roll:0,pitch:0,distM:0,time:55,scrape:0,msg:'',msgT:0,cps:[false,false,false],state:'run',hit:0,wipePhase:0,wipeBlend:0});
  const ov=document.getElementById('overlay');ov.hidden=true;ov.style.background='';
  startAudio();
}
// ----- the goal fanfare: a bright major arpeggio over a warm pad -----
function playFanfare(){
  if(!ac)return;
  try{
    if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+.06,out=ac.createGain();
    out.gain.value=.32;out.connect(ac.destination);
    // a soft pad underneath
    for(const p of [[261.63,.055],[392.00,.040],[523.25,.034]]){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(p[1],t0+.45);
      g.gain.setValueAtTime(p[1],t0+1.7);
      g.gain.exponentialRampToValueAtTime(.001,t0+3.1);
      o.connect(g);g.connect(out);o.start(t0);o.stop(t0+3.2);
    }
    // the arpeggio, each note a small bell
    const seq=[[523.25,0],[659.25,.13],[783.99,.26],[1046.50,.39],[783.99,.58],[1046.50,.72],[1318.51,.88]];
    for(const n of seq){
      const a=t0+n[1],o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
      o.type='triangle';o2.type='sine';
      o.frequency.value=n[0];o2.frequency.value=n[0]*2.005;
      lp.type='lowpass';lp.frequency.value=4600;
      g.gain.setValueAtTime(.0001,a);
      g.gain.exponentialRampToValueAtTime(.20,a+.018);
      g.gain.exponentialRampToValueAtTime(.0008,a+.62);
      o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(out);
      o.start(a);o2.start(a);o.stop(a+.7);o2.stop(a+.7);
    }
    // closing chord
    [523.25,659.25,783.99,1046.50].forEach((f,i)=>{
      const a=t0+1.06,o=ac.createOscillator(),g=ac.createGain();
      o.type=i%2?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,a);
      g.gain.exponentialRampToValueAtTime(.14,a+.03);
      g.gain.exponentialRampToValueAtTime(.0008,a+1.7);
      o.connect(g);g.connect(out);o.start(a);o.stop(a+1.8);
    });
  }catch(e){}
}
function endRun(kind){
  st.state=kind;
  st.msgT=0;st.msg='';
  const pct=Math.min(100,Math.round(st.pos/FIN*100));
  const o=document.getElementById('overlay');
  o.querySelector('h1').textContent=kind==='finish'?'ゴール':'タイムアップ';
  o.querySelector('p').textContent=kind==='finish'
    ?'高雄大駐車場のロードスターミーティング会場に到着しました。色とりどりのロードスターがお出迎えです。おつかれさまでした。'
    :'あと少し届きませんでした。ブレーキを残すコーナーを見直してみましょう。';
  document.getElementById('res').textContent='到達 '+pct+'%　走行 '+(st.distM/1000).toFixed(2)+' km　残り '+Math.max(0,st.time).toFixed(1)+' 秒';
  document.getElementById('go').textContent='もう一度';
  o.style.background=kind==='finish'?'linear-gradient(180deg,rgba(13,10,8,.30),rgba(13,10,8,.66))':'';
  o.hidden=false;
  if(kind==='finish')playFanfare();
}
// ----- obstacle contact -----
function thud(kind){
  if(!ac)return;
  try{
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(kind==='rock'?78:kind==='barrier'?96:130,t);
    o.frequency.exponentialRampToValueAtTime(40,t+.2);
    g.gain.setValueAtTime(kind==='rock'?.45:.22,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3);
  }catch(e){}
}
function hitObstacle(o){
  const k=o.kind;
  let spray='255,180,90';
  if(k==='rock'){st.speed*=.5;st.hit=1;st.msg='落石にヒット！'}
  else if(k==='cone'){st.speed*=.86;st.hit=.55;st.msg='パイロンに接触'}
  else if(k==='barrier'){st.speed*=.62;st.hit=.85;st.msg='バリケードに接触！'}
  else if(k==='puddle'){st.speed*=.9;st.hit=.4;st.x+=(st.x>0?1:-1)*.12;st.msg='水しぶき';spray='200,225,235'}
  else{st.speed*=.94;st.hit=.3;st.x+=(st.x>0?1:-1)*.06;st.msg='落ち葉で滑る';spray='230,150,60'}
  st.msgT=1.7;
  thud(k);
  for(let i=0;i<12;i++)sparks.push({x:W/2+(Math.random()-.5)*180,y:400+Math.random()*60,
    vx:(Math.random()-.5)*260,vy:-40-Math.random()*200,l:.3+Math.random()*.25,c:spray});
}
function update(dt){
  st.t+=dt;
  // pop-up lamps: the two motors run at slightly different speeds
  const lt=st.lightOn?1:0;
  st.lampL+=(lt-st.lampL)*Math.min(1,dt*(lt?7:6));
  st.lampR+=(lt-st.lampR)*Math.min(1,dt*(lt?5.5:7.5));
  if(Math.abs(lt-st.lampL)<.01)st.lampL=lt;
  if(Math.abs(lt-st.lampR)<.01)st.lampR=lt;
  const base=segs[Math.floor(st.pos/SEG)%N],sp=st.speed/MAXV;
  const live=st.state==='run';
  if(st.hit>0)st.hit=Math.max(0,st.hit-dt*1.8);
  const thr=live&&keys.up,brk=live&&keys.down,hb=live&&keys.space;
  const tgt=live?(keys.right?1:0)-(keys.left?1:0):0;
  st.steer+=(tgt-st.steer)*Math.min(1,dt*(tgt?7:10));
  const slope=(base.p2.world.y-base.p1.world.y)/SEG;
  if(thr)st.speed+=(MAXV*.16*Math.pow(1-sp,.85)+MAXV*.015)*dt; else st.speed-=MAXV*.035*dt;
  if(brk)st.speed-=MAXV*.5*dt;
  if(hb)st.speed-=MAXV*.22*dt;
  if(!live)st.speed-=MAXV*2.2*dt;      // she draws up just past the line
  st.speed-=slope*MAXV*.08*dt;
  // lateral: steering vs. centrifugal push in the bend
  const dx=dt*2.4*sp;
  st.x+=dx*st.steer*(hb?1.5:1);
  st.x-=dx*sp*base.curve*.32;
  st.scrape=Math.max(0,st.scrape-dt);
  if(Math.abs(st.x)>1.04){
    st.x=Math.sign(st.x)*1.04;
    st.speed=Math.max(st.speed-MAXV*.7*dt,MAXV*.16);
    st.scrape=.15;
  }
  st.speed=Math.max(0,Math.min(MAXV,st.speed));
  const prevPos=st.pos;
  st.pos+=dt*st.speed;
  if(live){
    for(const o of obstacles){
      if(o.z>prevPos&&o.z<=st.pos&&Math.abs(st.x-o.x)<o.r+.09)hitObstacle(o);
    }
  }
  st.kmh=st.speed/MAXV*198;
  st.dist=Math.min(1,st.pos/FIN);
  st.distM=st.dist*10700;   // the parkway is 10.7km gate to gate
  // automatic 5-speed
  if(st.rpm>6700&&st.gear<4)st.gear++;
  if(st.rpm<3300&&st.gear>0)st.gear--;
  const rt=900+Math.min(1,st.kmh/GEAR_MAX[st.gear])*6300+(thr?150:0);
  st.rpm+=(rt-st.rpm)*Math.min(1,dt*10);
  // body motion and cabin vibration
  const rollT=-base.curve*sp*.9-st.steer*sp*.4;
  st.roll+=(rollT-st.roll)*Math.min(1,dt*4);
  st.pitch+=((brk?5:thr?-1.5:0)-st.pitch)*Math.min(1,dt*5);
  st.vib=Math.sin(st.t*90)*(.25+st.rpm/8000*.5)*(1+sp*.6)+(st.scrape>0?Math.sin(st.t*160)*2.5:0);
  st.reflect=-st.steer*40+Math.sin(st.pos/3000)*60;
  bgOff+=base.curve*sp*dt*18;
  // wipers: they come up with the rain, park again when it clears
  const wet=TV.rain>.1&&st.wiper;
  if(wet){
    st.wipeBlend=Math.min(1,st.wipeBlend+dt*3.4);
    st.wipePhase=(st.wipePhase+dt*(1.05+Math.min(1,st.speed/MAXV)*1.15))%1;
  }else{
    st.wipeBlend=Math.max(0,st.wipeBlend-dt*1.6);
    const tgt=st.wipePhase>.5?1:0;
    st.wipePhase=st.wipePhase+Math.sign(tgt-st.wipePhase)*Math.min(Math.abs(tgt-st.wipePhase),dt*1.5);
  }
  updateEnv();
  if(live){
    st.time-=dt;
    const idx=base.index;
    for(let i=0;i<3;i++)if(!st.cps[i]&&idx>=CPS[i]){st.cps[i]=true;st.time+=25;st.msg='チェックポイント　+25秒';st.msgT=2.4}
    st.msgT=Math.max(0,st.msgT-dt);
    if(st.pos>=FIN)endRun('finish');
    else if(st.time<=0){st.time=0;endRun('over')}
  }
}
// ----- sparks and HUD -----
const sparks=[];
function drawSparks(dt){
  if(st.scrape>0&&st.speed>800){
    const rx=st.x>0;
    for(let i=0;i<3;i++)sparks.push({x:rx?840+Math.random()*40:110+Math.random()*30,y:rx?470:390,vx:(rx?-1:1)*(80+Math.random()*220),vy:-60-Math.random()*160,l:.35});
  }
  ctx.lineCap='round';
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.l-=dt;if(s.l<=0){sparks.splice(i,1);continue}
    s.vy+=520*dt;const nx=s.x+s.vx*dt,ny=s.y+s.vy*dt;
    const al=Math.min(1,s.l*3);
    ctx.strokeStyle=s.c?'rgba('+s.c+','+al+')':'rgba(255,'+(170+Math.random()*60|0)+',80,'+al+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(nx,ny);ctx.stroke();s.x=nx;s.y=ny;
  }
}
function panel(x,y,w,h){ctx.fillStyle='rgba(13,10,8,.62)';ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.fill()}
// ----- weather: rain in the air and a damp film on the glass -----
const rainDrops=[];
for(let i=0;i<130;i++)rainDrops.push({x:Math.random()*W*1.2,y:Math.random()*H-40,v:520+Math.random()*780,l:12+Math.random()*34,a:.1+Math.random()*.22});
function drawWeather(dt){
  if(TV.rain>.02){
    const sp=Math.min(1,st.speed/MAXV);
    ctx.save();ctx.lineCap='round';
    const n=Math.round(rainDrops.length*Math.min(1,TV.rain*1.15));
    for(let i=0;i<n;i++){
      const d=rainDrops[i];
      d.y+=d.v*dt*(1+sp*.7);d.x-=d.v*dt*.26;
      if(d.y>H+20){d.y=-30;d.x=Math.random()*W*1.25}
      if(d.x<-50)d.x=W+40;
      const len=d.l*(.55+.9*sp);
      ctx.strokeStyle='rgba(206,220,232,'+(d.a*TV.rain).toFixed(3)+')';
      ctx.lineWidth=1.1;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-len*.26,d.y+len);ctx.stroke();
    }
    ctx.restore();
    // damp film over the upper glass
    const g=ctx.createLinearGradient(0,24,0,340);
    g.addColorStop(0,'rgba(214,226,232,'+(TV.rain*.06).toFixed(3)+')');
    g.addColorStop(1,'rgba(206,220,228,'+(TV.rain*.025).toFixed(3)+')');
    ctx.fillStyle=g;ctx.fillRect(0,24,W,316);
  }
}
function drawHUD(){
  ctx.textBaseline='alphabetic';
  if(st.hit>0){ctx.fillStyle='rgba(190,40,20,'+(st.hit*.16)+')';ctx.fillRect(0,0,W,H)}
  panel(14,34,148,52);
  ctx.fillStyle='#a08c76';ctx.font='11px "Zen Kaku Gothic New",sans-serif';ctx.textAlign='left';ctx.fillText('残り時間',26,52);
  ctx.fillStyle=st.time<8?'#ff6a4a':'#f2e6d4';ctx.font='26px "Share Tech Mono",monospace';
  ctx.fillText(Math.max(0,st.time).toFixed(1),26,78);
  panel(W-196,34,182,52);
  ctx.fillStyle='#a08c76';ctx.font='11px "Zen Kaku Gothic New",sans-serif';ctx.textAlign='left';ctx.fillText('進行度',W-184,52);
  ctx.textAlign='right';ctx.fillStyle='#f2e6d4';ctx.font='13px "Share Tech Mono",monospace';ctx.fillText((st.distM/1000).toFixed(2)+' km',W-26,52);
  ctx.fillStyle='#3a2d24';ctx.fillRect(W-184,64,158,6);
  ctx.fillStyle='#f0a23a';ctx.fillRect(W-184,64,158*st.dist,6);
  for(const c of CPS){ctx.fillStyle='#f2e6d4';ctx.fillRect(W-184+158*c/N-1,60,2,14)}
  // clock and weather along the pass
  panel(W/2-86,34,172,52);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f2e6d4';ctx.font='13px "Share Tech Mono",monospace';ctx.fillText(TV.label,W/2,54);
  const inTun=segs[Math.floor(st.pos/SEG)%N].env.tunnel;
  const note=(inTun&&!st.lightOn)?'トンネル内 ライト H':(TV.night>.42&&!st.lightOn)?'ライト点灯 H':(st.wiper&&TV.rain>.18?'ワイパー作動中':'');
  if(note){
    const bl=.55+.45*Math.sin(st.t*5);
    ctx.fillStyle=(note[0]==='ラ'||note[0]==='ト')?'rgba(255,180,90,'+bl.toFixed(2)+')':'#a08c76';
    ctx.font='10px "Zen Kaku Gothic New",sans-serif';ctx.fillText(note,W/2,71);
  }
  if(st.msgT>0){
    ctx.globalAlpha=Math.min(1,st.msgT);ctx.textAlign='center';
    ctx.fillStyle='rgba(13,10,8,.7)';ctx.beginPath();ctx.roundRect(W/2-150,118,300,42,6);ctx.fill();
    ctx.fillStyle='#f0a23a';ctx.font='700 20px "Zen Kaku Gothic New",sans-serif';ctx.fillText(st.msg,W/2,146);
    ctx.globalAlpha=1;
  }
}
// ----- main loop -----
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  update(dt);
  const sh=st.hit>0?st.hit*10:0;
  ctx.save();
  if(sh)ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh*.7);
  renderWorld(st);
  ctx.restore();
  drawWeather(dt);
  drawCockpit(st,dt);
  drawSparks(dt);
  drawHUD();
  updateAudio();
  requestAnimationFrame(frame);
}
document.getElementById('go').addEventListener('click',reset);
requestAnimationFrame(frame);
</script>

</body></html>
