<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>紅葉ダッシュ！表示サイズ確認</title>
<style>
  html,body{margin:0;padding:0;background:#0b0810;overflow:hidden}
  #wrap{position:fixed;left:0;top:0}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" title="size check"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = Number(p.get('w')) || 390, h = Number(p.get('h')) || 844;
  var f = document.getElementById('f');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.setAttribute('width', w); f.setAttribute('height', h);
  f.src = 'index.html?embed=1&cb=' + Date.now();
</script>
</body>
</html>
